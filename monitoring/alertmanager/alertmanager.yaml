global:
  resolve_timeout: 1m

route:
  receiver: aiops-webhook
  group_by: ['alertname', 'namespace', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: aiops-webhook
    webhook_configs:
      - url: 'http://host.docker.internal:9090/webhook/alertmanager'
        send_resolved: true
