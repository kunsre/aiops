server:
  port: 8081
  connection-timeout: 30000

spring:
  datasource:
    url: jdbc:h2:mem:coredb
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
