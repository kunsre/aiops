apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-dashboard
  namespace: aiops
  labels:
    app: fault-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fault-dashboard
  template:
    metadata:
      labels:
        app: fault-dashboard
    spec:
      containers:
        - name: fault-dashboard
          image: fault-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
