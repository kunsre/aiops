server {
    listen 8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy to services (CORS bypass)
    location /proxy/data-worker/ {
        proxy_pass http://data-worker.aiops.svc.cluster.local:8000/;
    }
    location /proxy/api-gateway/ {
        proxy_pass http://api-gateway.aiops.svc.cluster.local:8080/;
    }
    location /proxy/bff-service/ {
        proxy_pass http://bff-service.aiops.svc.cluster.local:3000/;
    }
    location /proxy/core-business/ {
        proxy_pass http://core-business.aiops.svc.cluster.local:8081/;
    }
}
