server {
    listen 8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # MSA 트래픽: dashboard → api-gateway → bff → backends
    location /gateway/ {
        proxy_pass http://api-gateway.aiops.svc.cluster.local:8080/api/;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ArgoCD API: targetRevision 스위칭용
    location /argocd/ {
        proxy_pass http://argocd-server.argocd.svc.cluster.local/;
        proxy_set_header Content-Type application/json;
    }
}
