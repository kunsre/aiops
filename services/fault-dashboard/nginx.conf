server {
    listen 8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 모든 API 트래픽은 api-gateway를 통해 진입 (MSA 체인)
    # /gateway/aggregate → api-gateway:8080/api/aggregate → bff → data-worker + core-business
    location /gateway/ {
        proxy_pass http://api-gateway.aiops.svc.cluster.local:8080/api/;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
