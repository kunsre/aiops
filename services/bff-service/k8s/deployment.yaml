apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-service
  namespace: aiops
  labels:
    app: bff-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-service
  template:
    metadata:
      labels:
        app: bff-service
    spec:
      containers:
        - name: bff-service
          image: bff-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATA_WORKER_URL
              value: "http://data-worker:8000"
            - name: CORE_BUSINESS_URL
              value: "http://core-business:8081"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
