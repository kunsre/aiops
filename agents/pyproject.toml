[project]
name = "aiops-agents"
version = "0.1.0"
description = "LangGraph-based autonomous SRE multi-agent system"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pygithub>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_agents"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
